version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_services_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:270m
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHROMA_PATH=/app/data/chroma
      - SQLITE_PATH=/app/data/university.db
      - DOCUMENT_PATH=/app/data/documents
      - SOURCE_REGISTER_PATH=/app/data/source_register.csv
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_services_frontend
    restart: unless-stopped
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
